<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seruni Hijab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg class="bgdeco" aria-hidden="true" focusable="false"><defs><pattern id="doodle" width="170" height="170" patternUnits="userSpaceOnUse">
  <path d="M0 8C-14 -2 -7 -13 0 -6C7 -13 14 -2 0 8Z" transform="translate(28 30) scale(1.2)" style="fill:var(--d1)"/>
  <path d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z" transform="translate(120 26) scale(1.1)" style="fill:var(--d4)"/>
  <g transform="translate(88 88) scale(1.2)"><circle cx="0" cy="-7" r="5.5" style="fill:var(--d2)"/><circle cx="6.7" cy="-2.2" r="5.5" style="fill:var(--d2)"/><circle cx="4.1" cy="5.7" r="5.5" style="fill:var(--d2)"/><circle cx="-4.1" cy="5.7" r="5.5" style="fill:var(--d2)"/><circle cx="-6.7" cy="-2.2" r="5.5" style="fill:var(--d2)"/><circle r="3.2" style="fill:var(--d4)"/></g>
  <path d="M0 8C-14 -2 -7 -13 0 -6C7 -13 14 -2 0 8Z" transform="translate(138 130)" style="fill:var(--d3)"/>
  <path d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z" transform="translate(34 128) scale(.9)" style="fill:var(--d2)"/>
  <circle cx="64" cy="48" r="3.5" style="fill:var(--d3)"/><circle cx="150" cy="78" r="3" style="fill:var(--d1)"/><circle cx="10" cy="86" r="2.5" style="fill:var(--d4)"/><circle cx="98" cy="152" r="3.5" style="fill:var(--d1)"/>
</pattern></defs><rect width="100%" height="100%" fill="url(#doodle)"/></svg>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#beranda">Seruni</a>
    <nav class="nav" aria-label="Menu utama">
      <a href="#beranda" data-nav="beranda">Beranda</a>
      <a href="#toko" data-nav="toko">Toko</a>
      <a href="#dashboard" data-nav="dashboard">Dashboard</a>
      <button type="button" data-act="open-cart" aria-label="Buka keranjang">Keranjang<span class="badge cart-count" hidden>0</span></button>
    </nav>
  </div>
</header>

<main>
  <section data-page="beranda"><div id="home"></div></section>

  <section data-page="toko" hidden>
    <div class="wrap hero">
      <p class="eyebrow">Toko Seruni</p>
      <h1>Semua produk</h1>
      <p class="lead">Pilih kategori, lihat detail, baca komentar pembeli, lalu tambahkan ke keranjang.</p>
    </div>
    <div class="wrap">
      <div class="chips" id="chips" role="group" aria-label="Kategori"></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section data-page="checkout" hidden>
    <div class="wrap page" id="checkout"></div>
  </section>

  <section data-page="dashboard" hidden>
    <div class="wrap page" id="dashboard"></div>
  </section>
</main>
<footer class="site-foot"><div class="wrap">Seruni · Toko hijab · © 2026</div></footer>

<div class="scrim" id="scrim" data-act="close-all" hidden></div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="pm-title" hidden>
  <div class="sheet" id="modal-body"></div>
</div>
<aside class="drawer" id="drawer" aria-label="Keranjang belanja" hidden>
  <div class="drawer-head"><h2>Keranjang</h2><button class="x" type="button" data-act="close-cart" aria-label="Tutup keranjang">×</button></div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var KEY='seruni.v2', DAY=864e5;
var rupiah=function(n){return 'Rp'+new Intl.NumberFormat('id-ID').format(n)};
var fmtDate=function(t){return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(new Date(t))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var $=function(s,r){return (r||document).querySelector(s)};

/* ilustrasi produk (SVG, mengikuti tema) */
function svg(inner){return '<svg viewBox="0 0 200 200" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+inner+'</svg>'}
var FACE='<ellipse cx="100" cy="98" rx="30" ry="38" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>';
var HC=['var(--pop)','var(--accent)','color-mix(in srgb,var(--pop) 50%,var(--lav))','color-mix(in srgb,var(--pop) 45%,var(--mint))'];
function fl(c){return 'style="fill:'+c+'"'}
function segi(c,dots){
  var d='';if(dots)[[70,78],[100,78],[130,78],[85,102],[115,102],[100,126]].forEach(function(q){d+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="4.5" fill="var(--surface)" opacity=".85"/>'});
  return svg('<path d="M26 52H174L100 170Z" '+fl(c)+' stroke="var(--ink)" stroke-width="2"/><path d="M46 64H154L100 146Z" stroke="var(--surface)" stroke-width="2" stroke-dasharray="4 5"/>'+d);
}
function pash(c,pleat){
  var l='';
  if(pleat){for(var i=0;i<7;i++){var x=42+i*20;l+='<path d="M'+x+' 64q7 40 0 80" stroke="var(--surface)" stroke-width="1.6" opacity=".7"/>'}}
  else l='<path d="M26 84C64 58 92 108 132 82C152 70 168 76 174 78M26 108C64 82 92 132 132 106C152 94 168 100 174 102" stroke="var(--surface)" stroke-width="1.6" opacity=".7"/>';
  return svg('<path d="M26 60C64 34 92 84 132 58C152 46 168 52 174 54V142C136 164 108 112 68 142C50 154 36 148 26 144Z" '+fl(c)+'/>'+l);
}
function bergo(c,sport){
  return svg('<path d="M100 30C56 30 42 74 46 110C48 138 42 160 38 176H162C158 160 152 138 154 110C158 74 144 30 100 30Z" '+fl(c)+'/>'+FACE+
    '<path d="M60 150Q100 172 140 150" stroke="var(--surface)" stroke-width="2.5"/>'+(sport?'<path d="M50 70Q100 48 150 70" stroke="var(--surface)" stroke-width="5"/>':''));
}
function khimar(c,layer){
  return svg('<path d="M100 26C50 26 38 74 42 112C44 150 30 176 24 190H176C170 176 156 150 158 112C162 74 150 26 100 26Z" '+fl(c)+'/>'+FACE+
    '<path d="M42 142Q100 170 158 142" stroke="var(--surface)" stroke-width="2"/>'+(layer?'<path d="M32 172Q100 150 168 172" stroke="var(--surface)" stroke-width="2"/>':''));
}
var ART={
  segi:function(){return segi(HC[0],false)},segi2:function(){return segi(HC[3],true)},
  pash:function(){return pash(HC[2],false)},pash2:function(){return pash(HC[1],true)},
  bergo:function(){return bergo(HC[0],false)},sport:function(){return bergo(HC[2],true)},
  khimar:function(){return khimar(HC[3],false)},khimar2:function(){return khimar(HC[1],true)}
};

/* gambar produk: pakai foto jika kolom img diisi, jika kosong pakai ilustrasi bawaan */
function pic(p){return p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':ART[p.art]()}

/* katalog contoh: ganti dengan produk toko Anda.
   Untuk memakai foto: taruh file di folder foto/ lalu isi img, contoh img:'foto/segi-empat-voal.jpg' */
var PRODUCTS=[
  {id:'p1',name:'Segi Empat Polos Warna Pink',cat:'Hijab Segi Empat',price:79000,art:'segi',tint:'rose',img:'foto/488114d08fbd4c36a048609387c07973~.jpeg.jpg',desc:'Hijab segi empat berbahan voal ultrafine yang ringan dan mudah dibentuk. Ukuran 115 x 115 cm.'},
  {id:'p2',name:'Segi Empat Motif Bunga',cat:'Hijab Segi Empat',price:89000,art:'segi2',tint:'butter',img:'foto/S89ba99c4639f430d9e7e03e9500f465bf.jpg_720x720q80.jpg',desc:'Segi empat bermotif bunga kecil yang manis. Bahan jatuh lembut dan tidak mudah kusut. Ukuran 110 x 110 cm.'},
  {id:'p3',name:'Pashmina Ceruty Babydoll',cat:'Hijab Pashmina',price:69000,art:'pash',tint:'lav',img:'foto/7391d07a7e4d07f4738615178b1e18a8.jpg',desc:'Pashmina ceruty babydoll yang ringan dan mudah ditata. Tidak licin sehingga nyaman dipakai seharian. Ukuran 70 x 175 cm.'},
  {id:'p4',name:'Pashmina Plisket',cat:'Hijab Pashmina',price:85000,art:'pash2',tint:'peach',img:'foto/pashmina-plisket-ceruti-babydoll-461266.png',desc:'Pashmina berlipit rapi yang memberi tekstur tanpa perlu disetrika ulang. Cocok untuk acara santai maupun resmi. Ukuran 75 x 180 cm.'},
  {id:'p5',name:'Bergo Instan Jersey',cat:'Hijab Instan (Bergo / Sport)',price:75000,art:'bergo',tint:'mint',img:'foto/16b54c3d6fd9461d81b41d8a80c612d5~tplv-aphluv4xwc-resize-jpeg_700_0.jpeg',desc:'Bergo instan berbahan jersey yang lentur. Tinggal sarungkan, tanpa jarum dan peniti. Cocok untuk kegiatan harian.'},
  {id:'p6',name:'Hijab Sport Instan',cat:'Hijab Instan (Bergo / Sport)',price:79000,art:'sport',tint:'rose',img:'foto/sg-11134201-7qvdu-ljktmx7yc1ea84.jpg',desc:'Hijab instan untuk olahraga berbahan dry-fit yang cepat kering dan tidak gerah. Ada tali pengatur di bagian belakang kepala.'},
  {id:'p7',name:'Khimar Syari 2 Layer',cat:'Khimar',price:135000,art:'khimar',tint:'lav',img:'foto/id-11134207-7r98p-lsssa5z47drtdc.jpg',desc:'Khimar panjang dua layer yang menutup dada dan punggung. Bahan wolfis yang adem, jatuh, dan tidak menerawang.'},
  {id:'p8',name:'Khimar Pet Antem',cat:'Khimar',price:119000,art:'khimar2',tint:'peach',img:'foto/d6f8aa2d-14f5-45f0-8156-438bb41589c8.jpg.jpg',desc:'Khimar model pet antem dengan bagian depan yang rapi dan tali di belakang. Praktis dipakai untuk pergi sehari-hari.'}
];
var SHIP={reguler:{label:'Reguler',fee:15000,eta:'3 sampai 5 hari'},ekspres:{label:'Ekspres',fee:30000,eta:'1 sampai 2 hari'}};
var STATUS=['Baru','Dikemas','Dikirim','Selesai'];
var P=function(id){return PRODUCTS.filter(function(p){return p.id===id})[0]};

/* data: disimpan di browser, dengan cadangan di memori */
function seedOrder(id,ago,name,pairs,ship,pay,status){
  var items=pairs.map(function(x){var p=P(x[0]);return {pid:p.id,name:p.name,price:p.price,qty:x[1]}});
  var sub=items.reduce(function(s,i){return s+i.price*i.qty},0);
  return {id:id,ts:Date.now()-ago*DAY,name:name,phone:'08xx-xxxx-xxxx',address:'Alamat contoh',ship:ship,pay:pay,items:items,total:sub+SHIP[ship].fee,status:status,sample:true};
}
function seed(){
  var n=Date.now();
  return {cart:[],
    comments:[
      {id:'c1',pid:'p1',name:'Rina',rating:5,text:'Bahannya adem dan mudah dibentuk, tidak licin di kepala.',ts:n-2*DAY,sample:true},
      {id:'c2',pid:'p3',name:'Sinta',rating:4,text:'Pashminanya jatuh dengan bagus dan tidak mudah kusut.',ts:n-4*DAY,sample:true},
      {id:'c3',pid:'p5',name:'Maya',rating:5,text:'Bergonya praktis, tinggal pakai langsung rapi.',ts:n-6*DAY,sample:true},
      {id:'c4',pid:'p7',name:'Dewi',rating:4,text:'Khimarnya panjang dan menutup dada dengan nyaman.',ts:n-7*DAY,sample:true},
      {id:'c5',pid:'p6',name:'Ayu',rating:5,text:'Dipakai olahraga tetap nyaman dan tidak gerah.',ts:n-9*DAY,sample:true},
      {id:'c6',pid:'p1',name:'Lina',rating:4,text:'Warnanya sesuai foto dan jahitan tepinya rapi.',ts:n-11*DAY,sample:true},
      {id:'c7',pid:'p8',name:'Putri',rating:5,text:'Bahannya cukup tebal tapi tetap adem, tidak menerawang.',ts:n-12*DAY,sample:true}
    ],
    orders:[
      seedOrder('SRN-1004',1,'Rina S.',[['p1',1],['p5',2]],'ekspres','E-wallet','Baru'),
      seedOrder('SRN-1003',3,'Maya P.',[['p3',1]],'reguler','Transfer bank','Dikemas'),
      seedOrder('SRN-1002',6,'Sinta A.',[['p2',1],['p6',1]],'reguler','COD','Dikirim'),
      seedOrder('SRN-1001',10,'Ayu W.',[['p7',1],['p4',1]],'reguler','Transfer bank','Selesai')
    ]};
}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.cart)&&Array.isArray(d.comments)&&Array.isArray(d.orders))return d}}catch(e){}
  return seed();
}
var state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

var view='beranda',cat='Semua',dashFilter='all',draftRating=5,openPid=null,lastOrder=null,toastTimer=0;

/* helper data */
function ratingOf(pid){var c=state.comments.filter(function(x){return x.pid===pid});var n=c.length;return {n:n,avg:n?c.reduce(function(s,x){return s+x.rating},0)/n:0}}
function stars(n){return '<span class="stars" role="img" aria-label="'+n+' dari 5 bintang">'+'★'.repeat(n)+'☆'.repeat(5-n)+'</span>'}
function cartLines(){return state.cart.map(function(c){return {id:c.id,qty:c.qty,p:P(c.id)}}).filter(function(l){return l.p})}
function subtotal(){return cartLines().reduce(function(s,l){return s+l.p.price*l.qty},0)}
function cartCount(){return state.cart.reduce(function(s,c){return s+c.qty},0)}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},2200)}
function lock(){var open=!$('#modal').hidden||!$('#drawer').hidden;$('#scrim').hidden=!open;document.body.style.overflow=open?'hidden':''}

/* toko */
function tile(p){return ' style="--tile:var(--'+p.tint+')"'}
function cardHTML(p){
  var r=ratingOf(p.id);
  return '<article class="card"><button type="button" class="art"'+tile(p)+' tabindex="-1" data-act="open" data-id="'+p.id+'" aria-label="Lihat '+esc(p.name)+'">'+pic(p)+'</button>'+
    '<div class="card-body"><p class="cat">'+p.cat+'</p><h3><button type="button" class="link" data-act="open" data-id="'+p.id+'">'+esc(p.name)+'</button></h3>'+
    '<p class="rate">'+(r.n?'<span class="stars">★</span> '+r.avg.toFixed(1)+' <span class="muted">('+r.n+')</span>':'<span class="muted">Belum ada ulasan</span>')+'</p>'+
    '<div class="card-foot"><span class="price">'+rupiah(p.price)+'</span><button type="button" class="btn small" data-act="add" data-id="'+p.id+'">Tambah</button></div></div></article>';
}
function renderShop(){
  var cats=['Semua'].concat(PRODUCTS.map(function(p){return p.cat}).filter(function(c,i,a){return a.indexOf(c)===i}));
  $('#chips').innerHTML=cats.map(function(c){return '<button type="button" class="chip" data-act="filter" data-v="'+c+'" aria-pressed="'+(c===cat)+'">'+c+'</button>'}).join('');
  $('#grid').innerHTML=PRODUCTS.filter(function(p){return cat==='Semua'||p.cat===cat}).map(cardHTML).join('');
}

/* keranjang */
function addToCart(id){
  var l=state.cart.filter(function(c){return c.id===id})[0];
  if(l)l.qty+=1;else state.cart.push({id:id,qty:1});
  save();cartChanged();toast('Ditambahkan ke keranjang');
}
function cartChanged(){
  var n=cartCount();
  document.querySelectorAll('.cart-count').forEach(function(b){b.textContent=n;b.hidden=n===0});
  renderCart();
  if(view==='checkout'&&!lastOrder)refreshCheckoutSummary();
}
function renderCart(){
  var lines=cartLines(),body=$('#drawer-body'),foot=$('#drawer-foot');
  if(!lines.length){
    body.innerHTML='<div class="empty"><p>Keranjang masih kosong.</p><button type="button" class="btn ghost" data-act="close-cart">Lihat produk</button></div>';
    foot.hidden=true;return;
  }
  foot.hidden=false;
  body.innerHTML=lines.map(function(l){
    return '<div class="line"><div class="art"'+tile(l.p)+'>'+pic(l.p)+'</div><div><h3>'+esc(l.p.name)+'</h3><span class="price muted">'+rupiah(l.p.price)+'</span>'+
      '<div class="row"><div class="qty"><button type="button" data-act="dec" data-id="'+l.id+'" aria-label="Kurangi">−</button><span>'+l.qty+'</span><button type="button" data-act="inc" data-id="'+l.id+'" aria-label="Tambah">+</button></div>'+
      '<button type="button" class="link sm" data-act="rm" data-id="'+l.id+'">Hapus</button></div></div></div>';
  }).join('');
  foot.innerHTML='<div class="sum total"><span>Subtotal</span><span>'+rupiah(subtotal())+'</span></div><p class="meta">Ongkos kirim dipilih saat checkout.</p><a class="btn block" href="#checkout" data-act="close-cart">Lanjut ke checkout</a>';
}
function changeQty(id,d){
  var l=state.cart.filter(function(c){return c.id===id})[0];if(!l)return;
  l.qty+=d;if(l.qty<=0)state.cart=state.cart.filter(function(c){return c.id!==id});
  save();cartChanged();
}
function openCart(){closeModal();$('#drawer').hidden=false;lock();var x=$('#drawer .x');if(x)x.focus()}
function closeCart(){$('#drawer').hidden=true;lock()}

/* modal produk + komentar */
function openProduct(id){
  var p=P(id);if(!p)return;openPid=id;draftRating=5;
  $('#modal-body').innerHTML='<button type="button" class="x" data-act="close-modal" aria-label="Tutup">×</button>'+
    '<div class="pm"><div class="art"'+tile(p)+'>'+pic(p)+'</div><div class="pm-info"><p class="cat">'+p.cat+'</p><h2 id="pm-title">'+esc(p.name)+'</h2><p class="price lg">'+rupiah(p.price)+'</p><p>'+esc(p.desc)+'</p><button type="button" class="btn" data-act="add" data-id="'+p.id+'">Tambah ke keranjang</button></div></div>'+
    '<section class="pm-cm"><h3>Komentar <span class="muted" id="pm-count"></span></h3>'+
    '<form id="cm-form" class="cmform"><div class="field"><label for="cm-name">Nama</label><input id="cm-name" name="name" type="text" required maxlength="40" autocomplete="given-name"></div>'+
    '<div class="field"><span class="lbl" id="rate-lbl">Penilaian</span><div class="rating" role="group" aria-labelledby="rate-lbl">'+[1,2,3,4,5].map(function(n){return '<button type="button" data-act="rate" data-v="'+n+'" class="on" aria-label="'+n+' bintang">★</button>'}).join('')+'</div></div>'+
    '<div class="field"><label for="cm-text">Komentar</label><textarea id="cm-text" name="text" required maxlength="400" rows="3"></textarea></div>'+
    '<button type="submit" class="btn">Kirim komentar</button></form><ul class="cmlist" id="cm-list"></ul></section>';
  renderCommentList();
  closeCart();$('#modal').hidden=false;$('#modal-body').scrollTop=0;lock();$('#modal .x').focus();
}
function closeModal(){$('#modal').hidden=true;openPid=null;lock()}
function renderCommentList(){
  var list=$('#cm-list');if(!list||!openPid)return;
  var c=state.comments.filter(function(x){return x.pid===openPid}).sort(function(a,b){return b.ts-a.ts});
  $('#pm-count').textContent='('+c.length+')';
  list.innerHTML=c.length?c.map(function(x){
    return '<li class="cmitem"><div>'+stars(x.rating)+'</div><p>'+esc(x.text)+'</p><p class="meta">'+esc(x.name)+' · '+fmtDate(x.ts)+(x.sample?'<span class="tag">Contoh</span>':'')+'</p></li>';
  }).join(''):'<li class="muted cmitem">Belum ada komentar. Jadilah yang pertama.</li>';
}
function addComment(form){
  var name=form.elements.name.value.trim(),text=form.elements.text.value.trim();
  if(!name||!text)return;
  state.comments.push({id:'c'+Date.now(),pid:openPid,name:name,rating:draftRating,text:text,ts:Date.now()});
  save();form.reset();draftRating=5;setRating(5);
  renderCommentList();refreshView();
  toast('Komentar terkirim');
}
function setRating(n){draftRating=n;document.querySelectorAll('.rating button').forEach(function(b){b.classList.toggle('on',+b.dataset.v<=n)})}

/* checkout */
function summaryHTML(ship){
  var lines=cartLines(),sub=subtotal(),fee=SHIP[ship].fee;
  return '<h3>Ringkasan</h3>'+lines.map(function(l){return '<div class="sumline"><span>'+esc(l.p.name)+' × '+l.qty+'</span><span class="price">'+rupiah(l.p.price*l.qty)+'</span></div>'}).join('')+
    '<div class="sum" style="margin-top:12px"><span>Subtotal</span><span>'+rupiah(sub)+'</span></div>'+
    '<div class="sum"><span>Ongkos kirim ('+SHIP[ship].label+')</span><span>'+rupiah(fee)+'</span></div>'+
    '<div class="sum total" style="margin-top:8px"><span>Total</span><span>'+rupiah(sub+fee)+'</span></div>';
}
function currentShip(){var r=document.querySelector('input[name="ship"]:checked');return r?r.value:'reguler'}
function refreshCheckoutSummary(){
  if(!cartLines().length){renderCheckout();return}
  var el=$('#co-summary');if(el)el.innerHTML=summaryHTML(currentShip());
}
function renderCheckout(){
  var el=$('#checkout');
  if(lastOrder){
    var o=lastOrder;
    el.innerHTML='<div class="ok"><p class="eyebrow">Pesanan diterima</p><h2>Terima kasih, '+esc(o.name)+'</h2><p class="code">'+o.id+'</p>'+
      '<p>Total '+rupiah(o.total)+' · '+SHIP[o.ship].label+' ('+SHIP[o.ship].eta+') · '+esc(o.pay)+'</p>'+
      '<p class="muted">Ini versi contoh, jadi belum ada pembayaran sungguhan. Pesanan Anda sudah tercatat di dashboard.</p>'+
      '<div class="btns"><a class="btn" href="#dashboard">Lihat di dashboard</a><a class="btn ghost" href="#toko">Belanja lagi</a></div></div>';
    return;
  }
  if(!cartLines().length){
    el.innerHTML='<h2 class="pt">Checkout</h2><div class="empty"><p>Belum ada produk di keranjang.</p><a class="btn" href="#toko">Pilih produk</a></div>';
    return;
  }
  el.innerHTML='<h2 class="pt">Checkout</h2><div class="co"><form id="co-form" class="stack">'+
    '<fieldset class="stack"><legend>Data penerima</legend>'+
    '<div class="field"><label for="co-name">Nama lengkap</label><input id="co-name" name="name" type="text" required maxlength="60" autocomplete="name"></div>'+
    '<div class="field"><label for="co-phone">Nomor WhatsApp</label><input id="co-phone" name="phone" type="tel" required inputmode="tel" pattern="[0-9+\\-\\s]{8,18}" maxlength="18" autocomplete="tel" placeholder="08123456789"></div>'+
    '<div class="field"><label for="co-addr">Alamat lengkap</label><textarea id="co-addr" name="address" required maxlength="300" rows="3" autocomplete="street-address"></textarea></div></fieldset>'+
    '<fieldset><legend>Pengiriman</legend><div class="opts">'+Object.keys(SHIP).map(function(k,i){return '<label class="opt"><input type="radio" name="ship" value="'+k+'"'+(i===0?' checked':'')+'><span class="t">'+SHIP[k].label+'<small>Tiba dalam '+SHIP[k].eta+'</small></span><span class="amt">'+rupiah(SHIP[k].fee)+'</span></label>'}).join('')+'</div></fieldset>'+
    '<fieldset><legend>Pembayaran</legend><div class="opts">'+['Transfer bank','E-wallet','Bayar di tempat (COD)'].map(function(m,i){return '<label class="opt"><input type="radio" name="pay" value="'+m+'"'+(i===0?' checked':'')+'><span class="t">'+m+'</span></label>'}).join('')+'</div></fieldset>'+
    '<button type="submit" class="btn block">Buat pesanan</button></form>'+
    '<aside class="panel" id="co-summary">'+summaryHTML('reguler')+'</aside></div>';
}
function placeOrder(form){
  var lines=cartLines();if(!lines.length)return;
  var fd=new FormData(form),ship=fd.get('ship')||'reguler';
  var items=lines.map(function(l){return {pid:l.p.id,name:l.p.name,price:l.p.price,qty:l.qty}});
  var maxNo=state.orders.reduce(function(m,o){var n=parseInt(String(o.id).replace(/\D/g,''),10)||0;return Math.max(m,n)},1000);
  var order={id:'SRN-'+(maxNo+1),ts:Date.now(),name:String(fd.get('name')).trim(),phone:String(fd.get('phone')).trim(),address:String(fd.get('address')).trim(),ship:ship,pay:String(fd.get('pay')),items:items,total:subtotal()+SHIP[ship].fee,status:'Baru'};
  state.orders.unshift(order);state.cart=[];save();lastOrder=order;
  cartChanged();renderCheckout();window.scrollTo(0,0);
}

/* dashboard */
function dashCommentsHTML(){
  var c=state.comments.filter(function(x){return dashFilter==='all'||x.pid===dashFilter}).sort(function(a,b){return b.ts-a.ts});
  if(!c.length)return '<p class="muted" style="padding:14px 0">Belum ada komentar untuk produk ini.</p>';
  return '<ul>'+c.map(function(x){
    var p=P(x.pid);if(!p)return '';
    return '<li class="cm"><div class="art"'+tile(p)+'>'+pic(p)+'</div><div><div class="head"><strong>'+esc(p.name)+'</strong>'+stars(x.rating)+'</div><p>'+esc(x.text)+'</p>'+
      '<p class="meta">'+esc(x.name)+' · '+fmtDate(x.ts)+(x.sample?'<span class="tag">Contoh</span>':'')+' · <button type="button" class="link sm" data-act="del-comment" data-id="'+x.id+'">Hapus</button></p></div></li>';
  }).join('')+'</ul>';
}
function renderDashComments(){var el=$('#dash-comments');if(el)el.innerHTML=dashCommentsHTML()}
function renderDashboard(){
  var orders=state.orders,rev=orders.reduce(function(s,o){return s+o.total},0);
  var units=orders.reduce(function(s,o){return s+o.items.reduce(function(a,i){return a+i.qty},0)},0);
  var nNew=orders.filter(function(o){return o.status==='Baru'}).length;
  var cn=state.comments.length,avg=cn?state.comments.reduce(function(s,c){return s+c.rating},0)/cn:0;
  var sold=PRODUCTS.map(function(p){var q=0;orders.forEach(function(o){o.items.forEach(function(i){if(i.pid===p.id)q+=i.qty})});return {p:p,q:q}}).sort(function(a,b){return b.q-a.q}).filter(function(x){return x.q>0});
  var max=sold.length?sold[0].q:1;
  $('#dashboard').innerHTML='<h2 class="pt">Dashboard</h2>'+
    '<div class="stats"><div class="stat"><p class="k">Pesanan</p><p class="v">'+orders.length+'</p><p class="s">'+nNew+' baru</p></div>'+
    '<div class="stat"><p class="k">Pendapatan</p><p class="v">'+rupiah(rev)+'</p><p class="s">dari semua pesanan</p></div>'+
    '<div class="stat"><p class="k">Produk terjual</p><p class="v">'+units+'</p><p class="s">unit</p></div>'+
    '<div class="stat"><p class="k">Komentar</p><p class="v">'+cn+'</p><p class="s">'+(cn?'rata-rata '+avg.toFixed(1)+' dari 5':'belum ada')+'</p></div></div>'+
    '<div class="dash"><section class="panel"><div class="panel-head"><h3>Komentar produk</h3><label class="meta" for="dash-filter" style="display:none">Filter produk</label><select id="dash-filter" aria-label="Filter produk"><option value="all">Semua produk</option>'+
      PRODUCTS.map(function(p){return '<option value="'+p.id+'"'+(dashFilter===p.id?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div><div id="dash-comments">'+dashCommentsHTML()+'</div></section>'+
    '<section class="panel"><h3>Produk terlaris</h3>'+(sold.length?'<div class="bars">'+sold.map(function(x){return '<div class="bar-row"><div class="lab"><span>'+esc(x.p.name)+'</span><span class="price">'+x.q+' unit</span></div><div class="track"><div class="fill" style="width:'+Math.round(x.q/max*100)+'%"></div></div></div>'}).join('')+'</div>':'<p class="muted">Belum ada penjualan.</p>')+'</section>'+
    '<section class="panel full"><h3>Pesanan terbaru</h3>'+(orders.length?'<div class="tablewrap"><table><thead><tr><th>No.</th><th>Tanggal</th><th>Pelanggan</th><th>Item</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>'+
      orders.map(function(o){return '<tr><td>'+o.id+(o.sample?'<span class="tag">Contoh</span>':'')+'</td><td>'+fmtDate(o.ts)+'</td><td>'+esc(o.name)+'<br><span class="meta">'+esc(o.pay)+'</span></td><td>'+o.items.map(function(i){return esc(i.name)+' ×'+i.qty}).join('<br>')+'</td><td class="num">'+rupiah(o.total)+'</td>'+
        '<td><select data-order="'+o.id+'" aria-label="Status pesanan '+o.id+'">'+STATUS.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</tbody></table></div>':'<p class="muted">Belum ada pesanan.</p>')+'</section></div>'+
    '<div class="foot"><span>Data tersimpan di browser ini. Baris berlabel Contoh adalah data contoh.</span><button type="button" class="btn ghost small" data-act="reset-data">Kembalikan data contoh</button></div>';
}

/* beranda */
var DOODLE={
  heart:function(c,s){return '<svg viewBox="-14 -14 28 28" width="'+s+'" height="'+s+'" aria-hidden="true" focusable="false"><path d="M0 8C-14 -2 -7 -13 0 -6C7 -13 14 -2 0 8Z" style="fill:'+c+'"/></svg>'},
  spark:function(c,s){return '<svg viewBox="-14 -14 28 28" width="'+s+'" height="'+s+'" aria-hidden="true" focusable="false"><path d="M0 -12Q2 -2 12 0Q2 2 0 12Q-2 2 -12 0Q-2 -2 0 -12Z" style="fill:'+c+'"/></svg>'},
  flower:function(c,s){var p='';[[0,-7],[6.7,-2.2],[4.1,5.7],[-4.1,5.7],[-6.7,-2.2]].forEach(function(q){p+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="5.5" style="fill:'+c+'"/>'});return '<svg viewBox="-14 -14 28 28" width="'+s+'" height="'+s+'" aria-hidden="true" focusable="false">'+p+'<circle r="3.5" style="fill:var(--butter)"/></svg>'}
};
function refreshView(){if(view==='beranda')renderHome();else if(view==='toko')renderShop();else if(view==='dashboard')renderDashboard()}
function renderHome(){
  var seen={},firsts=[];
  PRODUCTS.forEach(function(p){if(!seen[p.cat]){seen[p.cat]=1;firsts.push(p)}});
  var stick=['p1','p3','p5','p7'].map(function(id){var p=P(id);return '<div class="sticker"'+tile(p)+'>'+pic(p)+'</div>'}).join('');
  var latest=state.comments.slice().sort(function(a,b){return b.ts-a.ts}).slice(0,3);
  var html=
    '<div class="hero-home"><div class="wrap hh"><div><p class="eyebrow">Toko hijab</p>'+
    '<h1>Seruni, hijab nyaman <span class="pop">untuk setiap hari</span></h1>'+
    '<p class="lead">Kami menjual hijab segi empat, pashmina, hijab instan (bergo dan sport), serta khimar dengan bahan nyaman dan model yang mudah dipakai. Ada '+PRODUCTS.length+' produk yang bisa Anda pilih.</p>'+
    '<div class="hh-cta"><a class="btn" href="#toko">Belanja sekarang</a><span class="meta">'+state.comments.length+' komentar pembeli</span></div></div>'+
    '<div class="stickers" aria-hidden="true">'+stick+
    '<span class="spark" style="top:-12px;right:2px">'+DOODLE.spark('var(--pop)',34)+'</span>'+
    '<span class="spark" style="bottom:-2px;left:-8px">'+DOODLE.heart('var(--pop)',28)+'</span>'+
    '<span class="spark" style="top:46%;right:-8px">'+DOODLE.flower('var(--pop)',30)+'</span></div></div></div>'+

    '<section class="sec"><div class="wrap"><h2>Belanja per kategori</h2><p class="sub">Pilih jenis hijab yang Anda cari.</p><div class="cats">'+
    firsts.map(function(p){return '<button type="button" class="cattile"'+tile(p)+' data-act="go-cat" data-v="'+p.cat+'">'+pic(p)+'<span>'+p.cat+'</span></button>'}).join('')+
    ''+'</div></div></section>'+

    '<section class="sec"><div class="wrap"><h2>Produk pilihan</h2><p class="sub">Satu pilihan dari setiap jenis hijab.</p><div class="grid">'+['p1','p3','p5','p7'].map(function(id){return cardHTML(P(id))}).join('')+'</div>'+
    '<div class="center"><a class="btn ghost" href="#toko">Lihat semua produk</a></div></div></section>'+

    '<section class="sec"><div class="wrap"><h2>Kenapa belanja di Seruni</h2><p class="sub">&nbsp;</p><div class="why">'+
    '<div class="whyi">'+DOODLE.spark('var(--pop)',30)+'<h3>Empat jenis hijab</h3><p>Segi empat, pashmina, instan, dan khimar tersedia di satu toko.</p></div>'+
    '<div class="whyi">'+DOODLE.heart('var(--pop)',30)+'<h3>Komentar pembeli</h3><p>Setiap produk punya kolom komentar, jadi Anda bisa membaca pengalaman pembeli lain.</p></div>'+
    '<div class="whyi">'+DOODLE.flower('var(--pop)',30)+'<h3>Checkout mudah</h3><p>Pilih produk, buka keranjang, isi data penerima, dan pesanan langsung tercatat.</p></div></div></div></section>'+

    (latest.length?'<section class="sec"><div class="wrap"><h2>Kata pembeli</h2><p class="sub">Komentar terbaru dari halaman produk.</p><div class="bubbles">'+
      latest.map(function(c){var p=P(c.pid);return '<div><div class="bubble">'+stars(c.rating)+'<p>'+esc(c.text)+'</p></div><p class="bwho">'+esc(c.name)+' · '+(p?esc(p.name):'')+(c.sample?'<span class="tag">Contoh</span>':'')+'</p></div>'}).join('')+'</div></div></section>':'')+

    '<section class="sec"><div class="wrap"><div class="band"><span class="spark" style="top:14px;left:18px">'+DOODLE.spark('var(--pop)',26)+'</span><span class="spark" style="bottom:14px;right:20px">'+DOODLE.heart('var(--pop)',26)+'</span>'+
    '<h2>Temukan hijab favoritmu</h2><a class="btn" href="#toko">Mulai belanja</a></div></div></section>';
  $('#home').innerHTML=html;
}

/* router */
function route(){
  var v=(location.hash||'#beranda').slice(1);
  if(['beranda','toko','dashboard','checkout'].indexOf(v)<0)v='beranda';
  view=v;if(v!=='checkout')lastOrder=null;
  document.querySelectorAll('[data-page]').forEach(function(s){s.hidden=s.dataset.page!==v});
  document.querySelectorAll('[data-nav]').forEach(function(a){if(a.dataset.nav===v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(v==='beranda')renderHome();else if(v==='toko')renderShop();else if(v==='dashboard')renderDashboard();else renderCheckout();
  closeModal();closeCart();window.scrollTo(0,0);
}

/* two-step: tombol yang menghapus meminta klik kedua */
function armed(btn,label){
  if(btn.dataset.armed){return true}
  var old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.textContent=old}},3000);
  return false;
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='open')openProduct(id);
  else if(a==='add'){addToCart(id)}
  else if(a==='filter'){cat=t.dataset.v;renderShop()}
  else if(a==='go-cat'){cat=t.dataset.v;location.hash='#toko'}
  else if(a==='open-cart')openCart();
  else if(a==='close-cart')closeCart();
  else if(a==='close-modal')closeModal();
  else if(a==='close-all'){closeModal();closeCart()}
  else if(a==='inc')changeQty(id,1);
  else if(a==='dec')changeQty(id,-1);
  else if(a==='rm')changeQty(id,-999);
  else if(a==='rate')setRating(+t.dataset.v);
  else if(a==='del-comment'){if(armed(t,'Yakin?')){state.comments=state.comments.filter(function(c){return c.id!==id});save();renderDashboard();renderShop()}}
  else if(a==='reset-data'){if(armed(t,'Yakin? Semua data diganti')){var keep=state.cart;state=seed();state.cart=keep;save();dashFilter='all';renderDashboard();renderShop();toast('Data contoh dikembalikan')}}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dash-filter'){dashFilter=t.value;renderDashComments()}
  else if(t.name==='ship'){refreshCheckoutSummary()}
  else if(t.dataset&&t.dataset.order){
    var o=state.orders.filter(function(x){return x.id===t.dataset.order})[0];
    if(o){o.status=t.value;save();renderDashboard()}
  }
});
document.addEventListener('submit',function(e){
  var f=e.target;
  if(f.id==='cm-form'){e.preventDefault();addComment(f)}
  else if(f.id==='co-form'){e.preventDefault();placeOrder(f)}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeCart()}});
window.addEventListener('hashchange',route);

cartChanged();
route();
})();
</script>
</body>
